[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-workflow-compiler"
version = "0.1.0"
description = "Vendor-neutral Skill-to-IR compiler and deterministic local workflow runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agentic-workflow = "agentic_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
