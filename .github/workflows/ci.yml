name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e '.[langgraph]'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Compile example
        run: agentic-workflow compile examples/document_pipeline/SKILL.md -o build/workflow.json
      - name: Validate example
        run: agentic-workflow validate build/workflow.json
      - name: Run example
        run: >-
          agentic-workflow run build/workflow.json
          --inputs examples/document_pipeline/inputs.json
          --workspace examples/document_pipeline
          --db .state/demo.sqlite3 --run-id ci-demo

  sit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install integration dependencies
        run: python -m pip install -e '.[all]'
      - name: Install real browser and desktop dependencies
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool python3-tk
      - name: Execute system integration scenarios
        run: >-
          xvfb-run -a python -m sit.run --output .state/sit-report.json
          --require-case browser_vendor_quote --require-case desktop_real
      - name: Verify real browser and desktop tool policies
        run: xvfb-run -a env AGENTIC_DESKTOP_SIT=1 python -m unittest tests.test_rpa tests.test_desktop -v
      - name: Verify operational console in Chromium
        run: python deploy/test_console.py
      - name: Retain SIT evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sit-evidence
          path: |
            .state/sit-report.json
            .state/sit-report.xml
            .state/sit-artifacts/
            .state/ui-report.json
            .state/ui-proof/
          include-hidden-files: true
          if-no-files-found: error

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Generate isolated deployment credentials
        run: python deploy/init.py
      - name: Build and start API and worker containers
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Prove container workflow and actual output file
        run: python deploy/smoke.py --docker
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 150
      - name: Stop deployment
        if: always()
        run: docker compose down --volumes
